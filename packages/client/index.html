<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#050914" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>险恶疑航 · Feed the Kraken</title>
    <!-- Menu + lobby backdrops: kicked off at HTML parse so the first paint
         already has them (CSS backgrounds otherwise lag one paint behind).
         ONLY first-screen art lives here — the 3M server shares 375KB/s
         across all players, so board-sized assets (map, cards) must NOT
         compete with the menu for bandwidth; the app fetches those when
         the board first renders. -->
    <link rel="preload" as="image" href="/bg/menu-bg.jpg" />
    <link rel="preload" as="image" href="/bg/lobby-bg.jpg" />
    <!-- CTA map cutout + faction wax seals: small, needed on the very first
         screens, preloaded so the glyph placeholder disc never even shows. -->
    <link rel="preload" as="image" href="/img/map-glyph.png" />
    <link rel="preload" as="image" href="/img/seal-sailor.png" />
    <link rel="preload" as="image" href="/img/seal-pirate.png" />
    <link rel="preload" as="image" href="/img/seal-cult.png" />
    <!-- Crew avatars: ~9KB each (128px JPEG); preloaded so the lobby picker
         and the roster never flash or pop in mid-session. -->
    <link rel="preload" as="image" href="/avatars/avatar-0.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-1.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-2.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-3.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-4.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-5.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-6.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-7.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-8.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-9.jpg" />
    <!-- Everything board-sized (map, nav/sail/camp cards, zone panels, ship
         marker, log backdrop) is intentionally NOT preloaded: it would eat
         the 3M pipe before the menu even paints. The <img>/<CSS> references
         inside the board components fetch them on first board render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+SC:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
