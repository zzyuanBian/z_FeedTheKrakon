<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050914" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>险恶疑航 · Feed the Kraken</title>
    <!-- Menu + lobby backdrops: kicked off at HTML parse so the first paint
         already has them (CSS backgrounds otherwise lag one paint behind). -->
    <link rel="preload" as="image" href="/bg/menu-bg.jpg" />
    <link rel="preload" as="image" href="/bg/lobby-bg.jpg" />
    <!-- CTA map cutout + faction wax seals: small, needed on the very first
         screens, preloaded so the glyph placeholder disc never even shows. -->
    <link rel="preload" as="image" href="/img/map-glyph.png" />
    <link rel="preload" as="image" href="/img/seal-sailor.png" />
    <link rel="preload" as="image" href="/img/seal-pirate.png" />
    <link rel="preload" as="image" href="/img/seal-cult.png" />
    <!-- Card scans are big; start fetching them at page load so they're
         already cached when the role-reveal screen or a nav-card choice
         appears. -->
    <link rel="preload" as="image" href="/cards/camp-back.jpg" />
    <link rel="preload" as="image" href="/cards/camp-fronts.jpg" />
    <link rel="preload" as="image" href="/cards/sail-cultUprising.jpg" />
    <link rel="preload" as="image" href="/cards/sail-blueDrunk.jpg" />
    <link rel="preload" as="image" href="/cards/sail-disarmed.jpg" />
    <link rel="preload" as="image" href="/cards/sail-redDrunk.jpg" />
    <link rel="preload" as="image" href="/cards/sail-mermaid.jpg" />
    <link rel="preload" as="image" href="/cards/sail-telescope.jpg" />
    <link rel="preload" as="image" href="/cards/sail-armed.jpg" />
    <!-- Board zone panels (discard sea + off-duty parchment) and the nav card
         back used by the discard stack: small, needed as soon as the board
         renders. -->
    <link rel="preload" as="image" href="/img/zone-drop.jpg" />
    <link rel="preload" as="image" href="/img/zone-rest.jpg" />
    <!-- Officer medals (lieutenant star / navigator wheel) for the roster. -->
    <link rel="preload" as="image" href="/img/crest-lieutenant.png" />
    <link rel="preload" as="image" href="/img/crest-navigator.png" />
    <!-- Log column's storm-deck backdrop: big PNG, wanted the moment the
         board renders, so fetch it alongside the zone panels. -->
    <link rel="preload" as="image" href="/img/log-bg.png" />
    <link rel="preload" as="image" href="/cards/nav-back.jpg" />
    <!-- Crew avatars: ~9KB each (128px JPEG); preloaded so the lobby picker
         and the roster never flash or pop in mid-session. -->
    <link rel="preload" as="image" href="/avatars/avatar-0.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-1.jpg" />
    <link rel="preload" as="image" href="/avatars/avatar-2.jpg" />

    <link rel="preload" as="image" href="/avatars/avatar-8.jpg" />

    />
