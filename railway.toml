# Railway deployment for Feed the Kraken.
#
# Forces the legacy Nixpacks builder (Railway's default Railpack as of 2025
# doesn't yet handle npm-workspaces monorepos reliably). The config below
# uses Nixpacks' own schema — `[phases.*]`, `[start]`, `[variables]` — which
# is what Nixpacks v1.x actually reads. (The `[build] / [deploy]` schema that
# older Railway docs show is ignored by Nixpacks.)
#
# Pipeline:
#   install → npm ci           (workspace-aware, installs all 5 packages)
#   build   → npm run build    (runs each workspace's build; only @ftk/client
#                               actually produces artefacts: Vite → dist/)
#   start   → npm start -w @ftk/server   (tsx runs TS source directly —
#                               promoted to a regular dep in that package)
#
# The built client is served by the same Node process via CLIENT_DIR — bgio's
# koa app doubles as a static file host with an SPA fallback (see
# packages/server/src/index.ts serveStatic).

[phases.install]
dependsOn = ["setup"]
cmds = ["npm ci"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build"]

[start]
cmd = "npm start -w @ftk/server"

[variables]
# Pin Node 20. Nixpacks would otherwise auto-pick the newest LTS (Node 24 at
# time of writing), which has known ESM/loader quirks that occasionally break
# tsx and boardgame.io's dual-package CJS/ESM setup.
NODE_VERSION = "20"

# The client build lands in packages/client/dist/ relative to the repo root.
# main.ts picks it up via this absolute path so the static middleware doesn't
# depend on CWD.
CLIENT_DIR = "/app/packages/client/dist"

# bgio's CORS layer reads this in main.ts. Leaving it empty here: Railway
# users must set this to their service URL (e.g.
# `https://feed-the-kraken.up.railway.app`) via the dashboard variables panel
# — otherwise cross-origin Socket.IO handshakes from the deployed domain are
# rejected and the client stays stuck on "连接中…".
ORIGINS = ""
